<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Banking App{% endblock %}</title>
  <!-- Bootstrap 5 CSS via CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body {
      background-color: #f7f8fa;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    .navbar-brand { font-weight: 600; letter-spacing: 0.02em; }
    .balance-card  { border-left: 4px solid #3b82d4; }
    footer         { font-size: 0.78rem; color: #57606a; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  {% block navbar %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">🏦 BankingApp</a>
      <div class="ms-auto">
        <span class="navbar-text text-light me-3">
          Welcome, {{ session.get('customer_name', '') }}
        </span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>
  {% endblock %}

  <div class="container" style="max-width:760px;">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center py-4 mt-5" style="border-top:1px solid #e5e7eb;">
    Made with IBM Bob
  </footer>

  <!-- Bootstrap 5 JS bundle via CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmcmMG1WDTFUe2kqEJNxsEqSIvvg"
    crossorigin="anonymous">
  </script>
</body>
</html>
